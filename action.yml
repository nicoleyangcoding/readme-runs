name: readme-runs
description: Run the shell commands in your README in a clean container to prove the setup steps still work.
author: Nicole Yang
branding:
  icon: terminal
  color: purple

inputs:
  file:
    description: Markdown file to check.
    default: README.md
  image:
    description: Docker image to run in. Defaults to the README's image comment, or ubuntu:24.04.
    default: ""
  timeout:
    description: Time limit per block, in seconds.
    default: "300"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install readme-runs
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}
    - name: Run README
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
      run: |
        args=("$INPUT_FILE" --timeout "$INPUT_TIMEOUT")
        [ -n "$INPUT_IMAGE" ] && args+=(--image "$INPUT_IMAGE")
        readme-runs "${args[@]}"

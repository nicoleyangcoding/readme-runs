[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "readme-runs"
version = "0.1.0"
description = "Run the shell commands in your README inside a clean container, to prove the setup steps still work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicole Yang" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["readme", "documentation", "testing", "docker", "ci", "markdown"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/nicoleyangcoding/readme-runs"
Issues = "https://github.com/nicoleyangcoding/readme-runs/issues"
Changelog = "https://github.com/nicoleyangcoding/readme-runs/blob/main/CHANGELOG.md"

[project.scripts]
readme-runs = "readme_runs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/readme_runs"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
